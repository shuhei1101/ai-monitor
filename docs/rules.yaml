# ai-monitor inject-rules ルール索引（SoT）
# rule: 索引ファイルからの相対パス / paths: 注入トリガーの glob（クォート必須）
# 実体ファイルを書くときに、その書式を定義するテンプレートを注入する
# 本索引は監視対象プロジェクトからも参照する（全プロジェクト共通の書式・規約だけを置く）
# ai-monitor 自身の開発でしか使わないルールは rules.self.yaml に置く
rules:
  - rule: wiki/テンプレート/シナリオ.md
    paths:
      - "**/docs/wiki/設計図/シナリオ/**/*.md"
  - rule: wiki/テンプレート/結合.md
    paths:
      - "**/docs/wiki/設計図/バックエンド結合/**/*.md"
      - "**/docs/wiki/設計図/フロントエンド結合/**/*.md"
  - rule: wiki/テンプレート/モジュール構成.md
    paths:
      - "**/docs/wiki/設計図/モジュール構成/**/*.md"
  - rule: wiki/テンプレート/アーキテクチャ図.md
    paths:
      - "**/docs/wiki/設計図/アーキテクチャ図.md"
  - rule: wiki/テンプレート/コンテナ構成.md
    paths:
      - "**/docs/wiki/設計図/コンテナ構成/**/*.md"
  - rule: wiki/テンプレート/設定.md
    paths:
      - "**/docs/wiki/設計図/設定/**/*.md"
  - rule: wiki/テンプレート/ER図.md
    paths:
      - "**/docs/wiki/設計図/ER図/**/*.md"
  - rule: wiki/テンプレート/状態遷移.md
    paths:
      - "**/docs/wiki/設計図/状態遷移/**/*.md"
  - rule: wiki/テンプレート/画面構成.md
    paths:
      - "**/docs/wiki/設計図/画面構成/**/*.md"
  - rule: wiki/テンプレート/データフロー.md
    paths:
      - "**/docs/wiki/設計図/データフロー/**/*.md"
  - rule: wiki/テンプレート/テストフィクスチャ.md
    paths:
      - "**/docs/wiki/設計図/テストフィクスチャ.md"
  - rule: wiki/テンプレート/チェックシート.md
    paths:
      - "**/docs/wiki/チェックシート/**/*.md"
  - rule: wiki/テンプレート/判定フローチャート.md
    paths:
      - "**/docs/wiki/判定フローチャート/**/*.md"
  - rule: wiki/テンプレート/外部API.md
    paths:
      - "**/docs/wiki/外部API/**/*.md"
  - rule: wiki/テンプレート/外部API一覧.md
    paths:
      - "**/docs/wiki/外部API/README.md"
  - rule: wiki/テンプレート/外部ライブラリ.md
    paths:
      - "**/docs/wiki/外部ライブラリ/**/*.md"
  - rule: wiki/テンプレート/外部ライブラリ一覧.md
    paths:
      - "**/docs/wiki/外部ライブラリ/README.md"
  - rule: wiki/テンプレート/テスト実行方法.md
    paths:
      - "**/docs/wiki/テスト/テスト実行方法.md"
  - rule: wiki/テンプレート/テンプレート.md
    paths:
      - "**/docs/wiki/テンプレート/**/*.md"
  - rule: wiki/テンプレート/README書式.md
    paths:
      - "**/docs/wiki/**/README.md"
  - rule: wiki/規約/Wiki管理.md
    paths:
      - "**/docs/wiki/**/*.md"
  - rule: wiki/規約/モック画面構成.md
    paths:
      - "**/docs/mock/**"
  - rule: wiki/規約/デザインスタイル.md
    paths:
      - "**/docs/mock/styles/**"
  - rule: wiki/規約/共通コンポーネント.md
    paths:
      - "**/docs/mock/components/**"
